<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo degrade cafe espresso profundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451e12" />
      <stop offset="45%" stop-color="#2a120a" />
      <stop offset="100%" stop-color="#140603" />
    </linearGradient>

    <!-- Degrade dorado calido para la taza y vapor -->
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Sombra suave para darle volumen -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Contenedor redondeado tipo App Icon (squircle) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#78350f" stroke-width="4" stroke-opacity="0.6" />

  <!-- Grupo del logo centrado perfectamente -->
  <g transform="translate(256, 260) scale(15.5) translate(-12, -11)" filter="url(#shadow)">
    <!-- Tres ondas de vapor ascendente elegantes -->
    <path
      d="M7 1.5C6.4 2.3 7.6 3.2 7 4"
      fill="none"
      stroke="#fef08a"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M11 0.8C10.4 2 11.6 3 11 4.2"
      fill="none"
      stroke="#fef08a"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M15 1.5C14.4 2.3 15.6 3.2 15 4"
      fill="none"
      stroke="#fef08a"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Relleno sutil del cuerpo de la taza para mayor visibilidad a tamaños pequeños -->
    <path
      d="M4 8h12v7a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8z"
      fill="#f59e0b"
      fill-opacity="0.18"
    />

    <!-- Silueta principal de la taza y asa de café VendyTrack -->
    <path
      d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"
      fill="none"
      stroke="url(#cupGrad)"
      stroke-width="2.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
